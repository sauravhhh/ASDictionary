<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>অর্থ - Assamese Dictionary</title>
<meta name="description" content="অর্থ — a fast, mobile-friendly English-Assamese and Assamese-English dictionary.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#ffffff;
    --card:#ffffff;
    --text:#191919;
    --muted:#6f6f6f;
    --border:#e9e9e9;
    --input:#f4f4f5;
    --accent:#e12d39;
    --accent-soft:rgba(225,45,57,.08);
    --radius:14px;
  }
  [data-theme="dark"] {
    --bg:#0b0b0d;
    --card:#141417;
    --text:#f2f2f2;
    --muted:#9a9aa0;
    --border:#232327;
    --input:#17171b;
    --accent:#f0434f;
    --accent-soft:rgba(240,67,79,.12);
  }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }

  /* ---------- sticky top ---------- */
  .sticky { position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--border); }
  .topbar {
    max-width:640px; margin:0 auto; padding:14px 16px 2px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .brand .dot { width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .brand em { font-style:normal; color:var(--accent); }
  .icon-btn {
    width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:var(--text); font-size:17px; cursor:pointer;
    display:grid; place-items:center;
  }
  .controls { max-width:640px; margin:0 auto; padding:10px 16px 14px; display:grid; gap:10px; }

  .seg { display:flex; background:var(--input); border-radius:13px; padding:4px; }
  .seg button {
    flex:1; border:none; background:transparent; padding:11px 6px; border-radius:10px;
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer;
    transition:all .15s ease; white-space:nowrap;
  }
  .seg button.active { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.14); }

  .searchbar {
    display:flex; align-items:center; gap:6px;
    background:var(--input); border:1.5px solid transparent; border-radius:var(--radius);
    padding:3px 3px 3px 14px; transition:border-color .15s ease, background .15s ease;
  }
  .searchbar:focus-within { border-color:var(--accent); background:var(--card); }
  .searchbar > i { color:var(--muted); font-size:16px; }
  .searchbar input {
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:inherit; font-size:17px; color:var(--text); padding:12px 0;
  }
  .searchbar input::placeholder { color:var(--muted); }
  #clearBtn {
    display:none; width:38px; height:38px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--border); color:var(--muted); font-size:16px; cursor:pointer;
    align-items:center; justify-content:center;
  }
  #clearBtn.show { display:flex; }

  .pills { display:flex; gap:8px; }
  .pills button {
    flex:1; padding:10px 4px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-family:inherit;
    font-size:13px; font-weight:700; cursor:pointer; transition:all .15s ease;
  }
  .pills button.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- results ---------- */
  .wrap { max-width:640px; margin:0 auto; padding:16px 16px 40px; }
  .result-meta { font-size:13px; color:var(--muted); margin:2px 2px 12px; }
  .word-card {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .word-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .word-title { font-size:25px; font-weight:800; letter-spacing:-.01em; line-height:1.25; overflow-wrap:anywhere; }
  .word-actions { display:flex; gap:2px; flex-shrink:0; }
  .word-actions button {
    width:44px; height:44px; border-radius:12px; border:none; background:transparent;
    color:var(--muted); font-size:18px; cursor:pointer;
    display:grid; place-items:center;
  }
  .word-actions button:active { background:var(--input); }
  .word-actions button.active { color:var(--accent); }
  .word-type {
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px; margin-bottom:12px;
  }
  .section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .section-title i { color:var(--accent); }
  .definition-list { list-style:none; }
  .definition-list li { padding:9px 0 9px 22px; position:relative; border-bottom:1px solid var(--border); font-size:16px; }
  .definition-list li:last-child { border-bottom:none; }
  .definition-list li:before { content:"•"; position:absolute; left:4px; color:var(--accent); font-weight:bold; }
  .related-words { display:flex; flex-wrap:wrap; gap:8px; }
  .related-word {
    background:var(--input); color:var(--text); border:none; border-radius:999px;
    padding:10px 16px; font-family:inherit; font-size:14.5px; font-weight:600;
    cursor:pointer; min-height:42px;
  }
  .related-word:active { background:var(--accent); color:#fff; }

  .no-results { text-align:center; padding:56px 20px; color:var(--muted); }
  .no-results i { font-size:44px; margin-bottom:14px; color:var(--border); display:block; }
  .no-results p { font-size:15px; }
  .loading { display:flex; justify-content:center; padding:48px 0 8px; }
  .loading i { font-size:30px; color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { text-align:center; color:var(--muted); font-size:14px; padding-bottom:40px; }

  .foot { text-align:center; color:var(--muted); font-size:13px; padding:24px 16px 40px; }
</style>
</head>
<body>

<div class="sticky">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><span>অর্থ<em>.</em></span></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
  </div>
  <div class="controls">
    <div class="seg" id="dirSeg">
      <button class="active" data-dir="enToAs">English → Assamese</button>
      <button data-dir="asToEn">Assamese → English</button>
    </div>
    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input id="searchInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Search for an English word..." enterkeyhint="search">
      <button id="clearBtn" aria-label="Clear search"><i class="fas fa-times"></i></button>
    </div>
    <div class="pills" id="typePills">
      <button class="active" data-type="exact">Exact</button>
      <button data-type="contains">Contains</button>
      <button data-type="starts">Starts with</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="result"></div>
</main>

<footer class="foot">Made with ❤️ by sauravhhh</footer>

<script>
(function () {
  'use strict';

  // Real data schema (dict1.json / dict2.json):
  //   Wrd, posAsm, posEng, IdeaID, Meanings
  // IdeaID groups synonyms: entries sharing an IdeaID are related words.
  var sampleData = [
    { Wrd: "ভাল", posAsm: "বিশেষণ", posEng: "adjective", IdeaID: 1, Meanings: "good, nice, fine, well" },
    { Wrd: "ঘৰ", posAsm: "বিশেষ্য", posEng: "noun", IdeaID: 3, Meanings: "house, home" },
    { Wrd: "water", posAsm: "বিশেষ্য", posEng: "noun", IdeaID: 4, Meanings: "পানী, জল" },
    { Wrd: "love", posAsm: "বিশেষ্য", posEng: "noun", IdeaID: 5, Meanings: "ভালপোৱা, স্নেহ" }
  ];

  var MAX_RESULTS = 50;
  var allWords = [];
  var dataReady = false;
  var searchDirection = 'enToAs';
  var searchType = 'exact';

  function $(id) { return document.getElementById(id); }
  var searchInput = $('searchInput'), resultDiv = $('result'),
      clearBtn = $('clearBtn'), themeBtn = $('themeBtn');

  /* ---------- theme ---------- */
  var themeIcon = themeBtn.querySelector('i');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeIcon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    try { localStorage.setItem('asdict-theme', t); } catch (e) {}
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('asdict-theme'); } catch (e) {}
  setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ---------- favorites (persisted) ---------- */
  var favorites = {};
  try { favorites = JSON.parse(localStorage.getItem('asdict-favs') || '{}'); } catch (e) { favorites = {}; }
  function saveFavs() {
    try { localStorage.setItem('asdict-favs', JSON.stringify(favorites)); } catch (e) {}
  }

  /* ---------- helpers ---------- */
  function isAssamese(s) { return /[\u0980-\u09FF]/.test(s || ''); }
  function sanitize(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function escAttr(str) {
    return sanitize(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) { return (s == null ? '' : String(s)).replace(/["']/g, '').trim(); }

  /* ---------- load data ---------- */
  function setLoading() {
    resultDiv.innerHTML = "<div class='loading'><i class='fas fa-spinner'></i></div>" +
      "<p class='loading-text'>Loading dictionary…</p>";
  }
  setLoading();

  Promise.all([
    fetch('dict2.json').then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(function () { return []; }),
    fetch('dict1.json').then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(function () { return []; })
  ]).then(function (res) {
    var words = res[0].concat(res[1]).filter(function (e) { return e && norm(e.Wrd); });
    allWords = words.length ? words : sampleData;
    dataReady = true;
    showHint();
  }).catch(function () {
    allWords = sampleData;
    dataReady = true;
    showHint();
  });

  function showHint() {
    resultDiv.innerHTML = "<div class='no-results'><i class='fas fa-book-open'></i>" +
      "<p>Type a word above to look it up.<br>Tap a related word to keep exploring.</p></div>";
  }

  /* ---------- direction + type controls ---------- */
  function setDirection(dir) {
    searchDirection = dir;
    var btns = document.querySelectorAll('#dirSeg button');
    btns.forEach(function (b) { b.classList.toggle('active', b.dataset.dir === dir); });
    searchInput.placeholder = dir === 'enToAs'
      ? "Search for an English word..."
      : "Search for an Assamese word...";
    rerun();
  }
  document.querySelectorAll('#dirSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setDirection(b.dataset.dir); });
  });
  document.querySelectorAll('#typePills button').forEach(function (b) {
    b.addEventListener('click', function () {
      searchType = b.dataset.type;
      document.querySelectorAll('#typePills button').forEach(function (x) {
        x.classList.toggle('active', x === b);
      });
      rerun();
    });
  });
  function rerun() { if (norm(searchInput.value)) showResult(searchInput.value); }

  /* ---------- live search ---------- */
  var debounceT = null;
  searchInput.addEventListener('input', function () {
    clearBtn.classList.toggle('show', !!searchInput.value);
    clearTimeout(debounceT);
    debounceT = setTimeout(function () { showResult(searchInput.value); }, 300);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(debounceT); showResult(searchInput.value); }
  });
  clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    clearBtn.classList.remove('show');
    showHint();
    searchInput.focus();
  });

  /* ---------- search ---------- */
  function findMatches(term) {
    var t = norm(term).toLowerCase();
    if (!t) return [];
    return allWords.filter(function (e) {
      var w = norm(e.Wrd);
      if (!w) return false;
      var wIsAs = isAssamese(w);
      if (searchDirection === 'enToAs' && wIsAs) return false;
      if (searchDirection === 'asToEn' && !wIsAs) return false;
      var wl = w.toLowerCase();
      if (searchType === 'exact') return wl === t;
      if (searchType === 'contains') return wl.indexOf(t) !== -1;
      return wl.indexOf(t) === 0;
    });
  }

  function relatedWords(entry) {
    var id = String(entry.IdeaID || '');
    if (!id) return [];
    var seen = {};
    seen[norm(entry.Wrd).toLowerCase()] = 1;
    var out = [];
    for (var i = 0; i < allWords.length; i++) {
      var e = allWords[i];
      if (String(e.IdeaID || '') !== id) continue;
      var w = norm(e.Wrd), k = w.toLowerCase();
      if (!w || seen[k]) continue;
      seen[k] = 1;
      out.push(w);
      if (out.length >= 12) break;
    }
    return out;
  }

  function showResult(term) {
    resultDiv.innerHTML = "";
    if (!dataReady) { setLoading(); return; }
    var t = norm(term);
    if (!t) { showHint(); return; }

    var matches = findMatches(t);
    if (!matches.length) {
      resultDiv.innerHTML = "<div class='no-results'><i class='fas fa-search'></i><p>No results for \"<b>" +
        sanitize(term) + "</b>\"<br>Try Contains or Starts with.</p></div>";
      return;
    }

    var meta = document.createElement('p');
    meta.className = 'result-meta';
    meta.textContent = matches.length === 1 ? '1 result' : matches.length + ' results';
    resultDiv.appendChild(meta);

    matches.slice(0, MAX_RESULTS).forEach(function (entry) {
      var word = norm(entry.Wrd);
      var pos = [norm(entry.posEng), norm(entry.posAsm)].filter(Boolean).join(' · ');
      var meanings = norm(entry.Meanings).split(',').map(function (m) { return m.trim(); })
        .filter(Boolean);
      var rel = relatedWords(entry);
      var isFav = !!favorites[word];

      var card = document.createElement('div');
      card.className = 'word-card';
      var html =
        '<div class="word-header">' +
          '<div class="word-title">' + sanitize(word) + '</div>' +
          '<div class="word-actions">' +
            '<button title="Listen" aria-label="Pronounce" data-act="speak"><i class="fas fa-volume-up"></i></button>' +
            '<button title="Favorite" aria-label="Favorite" data-act="fav" class="' + (isFav ? 'active' : '') + '">' +
              '<i class="' + (isFav ? 'fas' : 'far') + ' fa-heart"></i></button>' +
            '<button title="Share" aria-label="Share" data-act="share"><i class="fas fa-share-alt"></i></button>' +
          '</div>' +
        '</div>' +
        (pos ? '<div class="word-type">' + sanitize(pos) + '</div>' : '') +
        '<div class="section-title"><i class="fas fa-book"></i>Meanings</div>' +
        (meanings.length
          ? '<ul class="definition-list">' + meanings.map(function (m) {
              return '<li>' + sanitize(m) + '</li>';
            }).join('') + '</ul>'
          : '<div style="color:var(--muted)">No meanings listed.</div>');
      if (rel.length) {
        html += '<div class="section-title"><i class="fas fa-link"></i>Related words</div>' +
          '<div class="related-words">' + rel.map(function (r) {
            return '<button class="related-word" data-word="' + escAttr(r) + '">' + sanitize(r) + '</button>';
          }).join('') + '</div>';
      }
      card.innerHTML = html;
      card.dataset.word = word;
      resultDiv.appendChild(card);
    });

    if (matches.length > MAX_RESULTS) {
      var more = document.createElement('p');
      more.className = 'result-meta';
      more.style.textAlign = 'center';
      more.textContent = '+' + (matches.length - MAX_RESULTS) + ' more — refine your search.';
      resultDiv.appendChild(more);
    }
  }

  /* ---------- card actions ---------- */
  resultDiv.addEventListener('click', function (e) {
    var chip = e.target.closest('.related-word');
    if (chip && chip.dataset.word) {
      var w = chip.dataset.word;
      searchInput.value = w;
      clearBtn.classList.add('show');
      setDirection(isAssamese(w) ? 'asToEn' : 'enToAs');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('.word-card');
    var word = card ? card.dataset.word : '';
    if (!word) return;
    var act = btn.dataset.act;
    if (act === 'speak') pronounceWord(word);
    else if (act === 'fav') toggleFavorite(btn, word);
    else if (act === 'share') shareWord(word);
  });

  function pronounceWord(word) {
    try {
      if (!('speechSynthesis' in window)) return;
      var u = new SpeechSynthesisUtterance(word);
      u.lang = isAssamese(word) ? 'as-IN' : 'en-US';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function toggleFavorite(btn, word) {
    var icon = btn.querySelector('i');
    if (favorites[word]) {
      delete favorites[word];
      icon.className = 'far fa-heart';
      btn.classList.remove('active');
    } else {
      favorites[word] = 1;
      icon.className = 'fas fa-heart';
      btn.classList.add('active');
    }
    saveFavs();
  }

  function shareWord(word) {
    var text = 'Meaning of "' + word + '" — অর্থ Assamese Dictionary ' + window.location.href;
    if (navigator.share) {
      navigator.share({ title: 'অর্থ - Assamese Dictionary', text: text }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {}, function () {});
    }
  }
})();
</script>
</body>
</html>
